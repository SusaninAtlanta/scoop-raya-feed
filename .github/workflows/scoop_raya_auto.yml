name: Scoop With Raya — Auto Feed

# Prevent overlapping runs from pushing at the same time
concurrency:
  group: scoop-raya-auto-feed-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  schedule:
    - cron: "17 4 * * *"   # every day at 04:17 UTC
  push:
    branches: [ "main" ]
    paths:
      - scripts/scrape_shahid_scoop.py
      - .github/workflows/scoop_raya_auto.yml
      - data/seen_ids.json
  workflow_dispatch: {}      # allows manual run from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # allow pull --rebase before pushing

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml feedgen dateparser

      - name: Ensure folders exist
        run: |
          mkdir -p data
          mkdir -p debug

      - name: Run scraper to generate feeds
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          echo "Before scraper, files present:"
          ls -la
          echo "Running scraper..."
          # If your script requires args, add them here. For now we run as-is:
          python scripts/scrape_shahid_scoop.py
          echo "After scraper, files present:"
          ls -la
          echo "If debug dir exists, list it:"
          [ -d debug ] && ls -la debug || echo "No debug directory"

      - name: Validate generated XML files (best-effort; do not fail yet)
        continue-on-error: true
        run: |
          python - << 'PY'
          import sys, xml.etree.ElementTree as ET, pathlib
          for fp in ["scoop_with_raya_live.xml", "scoop_with_raya_backfill_100.xml"]:
              p = pathlib.Path(fp)
              if p.exists():
                  try:
                      ET.parse(p)
                      print(f"{fp}: XML is well-formed.")
                  except ET.ParseError as e:
                      print(f"{fp}: XML parse error: {e}")
              else:
                  print(f"{fp}: not found (skipping validation)")
          PY

      - name: Print first lines of XMLs (for inspection)
        continue-on-error: true
        run: |
          for f in scoop_with_raya_live.xml scoop_with_raya_backfill_100.xml; do
            if [ -f "$f" ]; then
              echo "----- BEGIN $f (first 50 lines) -----"
              head -n 50 "$f"
              echo "----- END $f -----"
            else
              echo "$f not found"
            fi
          done

      - name: Upload run artifacts (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: scoop-raya-run
          path: |
            scoop_with_raya_live.xml
            scoop_with_raya_backfill_100.xml
            data/seen_ids.json
            debug/**

      - name: Commit and push if changed
        run: |
          set -e

          # Ensure files exist so 'git diff' doesn't error on first run
          [ -f scoop_with_raya_live.xml ] || touch scoop_with_raya_live.xml
          [ -f scoop_with_raya_backfill_100.xml ] || touch scoop_with_raya_backfill_100.xml
          [ -f data/seen_ids.json ] || echo "{}" > data/seen_ids.json

          # Check if any of the target files changed
          if git diff --quiet -- scoop_with_raya_backfill_100.xml scoop_with_raya_live.xml data/seen_ids.json; then
            echo "No changes to commit."
            exit 0
          fi

          # Configure bot identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Commit our changes
          git add scoop_with_raya_backfill_100.xml scoop_with_raya_live.xml data/seen_ids.json
          git commit -m "chore: auto-update Scoop With Raya feeds [skip ci]"

          # Pull latest remote changes and replay our commit on top (fixes 'fetch first' errors)
          git pull --rebase origin main

          # Push
          git push
